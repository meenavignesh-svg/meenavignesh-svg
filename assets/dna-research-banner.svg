<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Animated biotechnology research banner</title>
<desc id="desc">A cyan and teal DNA double helix with moving base-pair markers on a dark scientific background.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset=".55" stop-color="#0b2637"/><stop offset="1" stop-color="#102b38"/></linearGradient>
 <linearGradient id="dna" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity=".08" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="300" rx="22" fill="url(#bg)"/><rect width="1200" height="300" rx="22" fill="url(#grid)"/>
<g opacity=".24" fill="none" stroke="#67e8f9"><circle cx="1040" cy="140" r="105"/><circle cx="1040" cy="140" r="78"/><path d="M930 140h220M1040 30v220"/></g>
<g fill="none" stroke="url(#dna)" stroke-width="5" stroke-linecap="round" filter="url(#glow)">
 <path d="M820 15 C650 65 990 115 820 165 S990 265 820 285" stroke-dasharray="12 7"><animate attributeName="stroke-dashoffset" values="0; -76" dur="5s" repeatCount="indefinite"/></path>
 <path d="M990 15 C1160 65 820 115 990 165 S820 265 990 285" stroke-dasharray="12 7"><animate attributeName="stroke-dashoffset" values="0; 76" dur="5s" repeatCount="indefinite"/></path>
</g>
<g stroke="#a5f3fc" stroke-width="2.5" opacity=".85">
<path d="M850 31L960 31M790 61L1020 61M800 91L1010 91M850 121L960 121M850 151L960 151M790 181L1020 181M800 211L1010 211M850 241L960 241M850 271L960 271">
<animate attributeName="opacity" values=".25;1;.25" dur="3.2s" repeatCount="indefinite"/></path></g>
<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#ecfeff">
 <text x="64" y="91" font-size="19" letter-spacing="5" fill="#5eead4">BIOTECHNOLOGY • BIOPROCESS • COMPUTATIONAL BIOLOGY</text>
 <text x="60" y="157" font-size="57" font-weight="700" letter-spacing="1">MEENA VIGNESH M</text>
 <text x="64" y="198" font-size="20" fill="#bae6fd">Research-minded biotechnology undergraduate</text>
 <text x="64" y="244" font-size="14" letter-spacing="3" fill="#67e8f9">DESIGN  /  MEASURE  /  ANALYSE  /  VALIDATE</text>
</g>
<circle cx="1120" cy="54" r="4" fill="#5eead4"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="1080" cy="260" r="3" fill="#60a5fa"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
</svg>