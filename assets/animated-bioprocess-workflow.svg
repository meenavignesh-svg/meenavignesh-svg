<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc">
  <title id="title">Animated bioprocess engineering workflow</title>
  <desc id="desc">A conceptual process diagram showing feed preparation, fermentation in a bioreactor, monitoring and control, and downstream recovery. Animated particles travel between stages; bubbles move inside the bioreactor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071827"/><stop offset="1" stop-color="#102f43"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".85"/><stop offset="1" stop-color="#0891b2" stop-opacity=".5"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .node{fill:#0b2434;stroke:#236079;stroke-width:1.5}
      .label{font:600 16px Arial,sans-serif;fill:#e6f7ff;text-anchor:middle}
      .small{font:12px Arial,sans-serif;fill:#9cc8d9;text-anchor:middle}
      .line{fill:none;stroke:#2a6479;stroke-width:3;stroke-linecap:round}
      .dot{fill:#5eead4;filter:url(#glow)}
      .iconline{fill:none;stroke:#67e8f9;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1100" height="350" rx="22" fill="url(#bg)"/>
  <circle cx="60" cy="45" r="90" fill="#0e7490" opacity=".10"/><circle cx="1040" cy="315" r="120" fill="#0d9488" opacity=".09"/>
  <text x="550" y="38" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#5eead4" text-anchor="middle">BIOPROCESS ENGINEERING • CONCEPTUAL WORKFLOW</text>
  <path class="line" d="M185 170 H245 M395 170 H455 M605 170 H665 M815 170 H875"/>
  <path d="M237 162 L247 170 L237 178 M447 162 L457 170 L447 178 M657 162 L667 170 L657 178 M867 162 L877 170 L867 178" stroke="#67e8f9" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="dot" r="5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M185 170 H245"/></circle>
  <circle class="dot" r="5"><animateMotion dur="2.4s" begin=".55s" repeatCount="indefinite" path="M395 170 H455"/></circle>
  <circle class="dot" r="5"><animateMotion dur="2.4s" begin="1.1s" repeatCount="indefinite" path="M605 170 H665"/></circle>
  <circle class="dot" r="5"><animateMotion dur="2.4s" begin="1.65s" repeatCount="indefinite" path="M815 170 H875"/></circle>
  <g>
    <rect class="node" x="35" y="85" width="150" height="170" rx="16"/>
    <circle cx="110" cy="135" r="29" fill="#10394a" stroke="#2dd4bf" stroke-width="1.5"/>
    <path class="iconline" d="M96 123 h28 l-4 27 q-10 8 -20 0z M100 137 h20"/>
    <path d="M103 116 l4 7 M116 116 l-4 7" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
    <text class="label" x="110" y="195">Feed preparation</text><text class="small" x="110" y="216">Media • inputs</text><text class="small" x="110" y="233">conditioning</text>
  </g>
  <g>
    <rect class="node" x="245" y="85" width="150" height="170" rx="16"/>
    <circle cx="320" cy="135" r="29" fill="#10394a" stroke="#2dd4bf" stroke-width="1.5"/>
    <path class="iconline" d="M308 116 v9 l-8 20 q-2 7 7 7 h26 q9 0 6-8 l-7-19 v-9 M308 125 h24 M311 139 q9 5 18 0"/>
    <text class="label" x="320" y="195">Bioreactor</text><text class="small" x="320" y="216">Fermentation /</text><text class="small" x="320" y="233">bioconversion</text>
    <circle cx="311" cy="144" r="2.5" fill="#d1fae5"><animate attributeName="cy" values="147;132;147" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="322" cy="146" r="2" fill="#d1fae5"><animate attributeName="cy" values="147;129;147" dur="2.2s" begin=".3s" repeatCount="indefinite"/></circle>
    <circle cx="332" cy="143" r="2.5" fill="#d1fae5"><animate attributeName="cy" values="146;134;146" dur="1.6s" begin=".7s" repeatCount="indefinite"/></circle>
  </g>
  <g>
    <rect class="node" x="455" y="85" width="150" height="170" rx="16"/>
    <circle cx="530" cy="135" r="29" fill="#10394a" stroke="#2dd4bf" stroke-width="1.5"/>
    <circle cx="530" cy="135" r="16" fill="none" stroke="#67e8f9" stroke-width="2"/>
    <path class="iconline" d="M530 123 v13 l9 6 M530 113 v4 M552 135 h-4"/>
    <circle cx="530" cy="135" r="3" fill="#5eead4"><animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/></circle>
    <text class="label" x="530" y="195">Monitor &amp; control</text><text class="small" x="530" y="216">pH • temperature</text><text class="small" x="530" y="233">DO • feed • mixing</text>
  </g>
  <g>
    <rect class="node" x="665" y="85" width="150" height="170" rx="16"/>
    <circle cx="740" cy="135" r="29" fill="#10394a" stroke="#2dd4bf" stroke-width="1.5"/>
    <path class="iconline" d="M725 121 h30 v28 h-30z M730 128 h20 M730 134 h20 M730 140 h12"/>
    <path d="M749 142 l4 4 7-9" stroke="#5eead4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/></path>
    <text class="label" x="740" y="195">Process analysis</text><text class="small" x="740" y="216">Trends • sampling</text><text class="small" x="740" y="233">quality checks</text>
  </g>
  <g>
    <rect class="node" x="875" y="85" width="190" height="170" rx="16"/>
    <circle cx="970" cy="135" r="29" fill="#10394a" stroke="#2dd4bf" stroke-width="1.5"/>
    <path class="iconline" d="M954 119 h32 v32 h-32z M960 126 h20 M960 133 h20 M960 140 h14"/>
    <path d="M960 145 l5 4 10-11" stroke="#5eead4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="970" y="195">Downstream</text><text class="small" x="970" y="216">Separation • recovery</text><text class="small" x="970" y="233">product quality</text>
  </g>
  <text x="550" y="302" font-family="Arial,sans-serif" font-size="12" fill="#9cc8d9" text-anchor="middle">Illustrative learning diagram — not a validated process design or operating recipe</text>
  <rect x="380" y="322" width="340" height="3" rx="1.5" fill="#173c50"/>
  <rect x="380" y="322" width="70" height="3" rx="1.5" fill="url(#accent)"><animate attributeName="x" values="380;650;380" dur="4s" repeatCount="indefinite"/></rect>
</svg>