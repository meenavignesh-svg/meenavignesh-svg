<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#160b2d"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="dnaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="300" rx="22" fill="url(#bg)"/>

  <!-- Ambient floating particles -->
  <g fill="#67e8f9" opacity="0.55">
    <circle cx="90" cy="165" r="2"><animate attributeName="cy" values="165;125;165" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="175" cy="105" r="1.5"><animate attributeName="cy" values="105;145;105" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="165" r="2"><animate attributeName="cy" values="165;115;165" dur="4.7s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="90" r="1.5"><animate attributeName="cy" values="90;135;90" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Animated DNA -->
  <g transform="translate(0 5)" filter="url(#glow)">
    <path d="M40 65 C160 15 230 125 350 75 C470 25 540 135 660 80 C780 25 850 115 960 65" fill="none" stroke="url(#dnaGrad)" stroke-width="3" opacity="0.9">
      <animate attributeName="d" dur="5s" repeatCount="indefinite" values="M40 65 C160 15 230 125 350 75 C470 25 540 135 660 80 C780 25 850 115 960 65;M40 75 C160 125 230 15 350 85 C470 135 540 25 660 90 C780 135 850 25 960 75;M40 65 C160 15 230 125 350 75 C470 25 540 135 660 80 C780 25 850 115 960 65"/>
    </path>
    <path d="M40 115 C160 165 230 55 350 125 C470 175 540 65 660 130 C780 175 850 65 960 115" fill="none" stroke="url(#dnaGrad)" stroke-width="3" opacity="0.9">
      <animate attributeName="d" dur="5s" repeatCount="indefinite" values="M40 115 C160 165 230 55 350 125 C470 175 540 65 660 130 C780 175 850 65 960 115;M40 105 C160 55 230 165 350 115 C470 65 540 175 660 120 C780 65 850 175 960 105;M40 115 C160 165 230 55 350 125 C470 175 540 65 660 130 C780 175 850 65 960 115"/>
    </path>

    <g opacity="0.65" stroke="#67e8f9" stroke-width="1.5">
      <line x1="100" y1="42" x2="100" y2="138"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></line>
      <line x1="220" y1="30" x2="220" y2="150"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></line>
      <line x1="340" y1="72" x2="340" y2="128"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></line>
      <line x1="460" y1="42" x2="460" y2="150"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></line>
      <line x1="580" y1="78" x2="580" y2="132"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/></line>
      <line x1="700" y1="48" x2="700" y2="148"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></line>
      <line x1="820" y1="68" x2="820" y2="132"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></line>
      <line x1="900" y1="45" x2="900" y2="140"><animate attributeName="opacity" values="1;0.2;1" dur="1.7s" repeatCount="indefinite"/></line>
    </g>
  </g>

  <text x="500" y="192" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="46" font-weight="700" fill="url(#titleGrad)">Meena Vignesh M</text>
  <text x="500" y="222" text-anchor="middle" font-family="Consolas, monospace" font-size="14" letter-spacing="2" fill="#b8c7e6">
    COMPUTATIONAL BIOLOGY • BIOINFORMATICS • BIOTECHNOLOGY
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite"/>
  </text>

  <rect x="175" y="242" width="650" height="34" rx="17" fill="#0b132d" stroke="#33456f"/>
  <circle cx="200" cy="259" r="5" fill="#34d399">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="220" y="264" font-family="Consolas, monospace" font-size="12" fill="#8bdcff">BIOINFORMATICS EXPLORER</text>
  <text x="500" y="264" font-family="Consolas, monospace" font-size="12" fill="#64748b">•</text>
  <text x="520" y="264" font-family="Consolas, monospace" font-size="12" fill="#c4b5fd">AI × LIFE SCIENCE</text>
  <text x="665" y="264" font-family="Consolas, monospace" font-size="12" fill="#64748b">•</text>
  <text x="685" y="264" font-family="Consolas, monospace" font-size="12" fill="#f0abfc">2ND YEAR</text>
</svg>
