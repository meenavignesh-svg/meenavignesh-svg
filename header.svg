<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#0a0f24"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd8ff"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="helixGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- DNA helix strands -->
  <g opacity="0.55">
    <path d="M0,40 C120,10 180,90 300,60 C420,30 480,110 600,80 C720,50 780,130 900,100 C960,85 1000,95 1000,95"
          stroke="url(#helixGrad)" stroke-width="2" fill="none"/>
    <path d="M0,90 C120,120 180,40 300,70 C420,100 480,20 600,50 C720,80 780,0 900,30 C960,45 1000,35 1000,35"
          stroke="url(#helixGrad)" stroke-width="2" fill="none"/>
  </g>
  <g id="rungs" opacity="0.7">
    <!-- rungs connecting the two strands, generated at intervals -->
    <line x1="30" y1="42" x2="30" y2="86" stroke="#4fd1e5" stroke-width="1.5"/>
    <line x1="90" y1="22" x2="90" y2="112" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="150" y1="40" x2="150" y2="65" stroke="#4fd1e5" stroke-width="1.5"/>
    <line x1="210" y1="70" x2="210" y2="45" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="270" y1="65" x2="270" y2="72" stroke="#4fd1e5" stroke-width="1.5"/>
    <line x1="330" y1="45" x2="330" y2="90" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="390" y1="35" x2="390" y2="100" stroke="#4fd1e5" stroke-width="1.5"/>
    <line x1="450" y1="60" x2="450" y2="40" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="510" y1="90" x2="510" y2="55" stroke="#4fd1e5" stroke-width="1.5"/>
    <line x1="570" y1="75" x2="570" y2="45" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="630" y1="55" x2="630" y2="80" stroke="#4fd1e5" stroke-width="1.5"/>
    <line x1="690" y1="40" x2="690" y2="10" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="750" y1="95" x2="750" y2="55" stroke="#4fd1e5" stroke-width="1.5"/>
    <line x1="810" y1="70" x2="810" y2="40" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="870" y1="105" x2="870" y2="65" stroke="#4fd1e5" stroke-width="1.5"/>
    <line x1="930" y1="90" x2="930" y2="50" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>

  <!-- faint code snippet, top-left, like the reference -->
  <text x="20" y="20" fill="#3b4a6b" font-family="monospace" font-size="10">def decode_life(sequence):</text>

  <!-- DNA emoji-like icon + Title -->
  <text x="270" y="175" font-family="Verdana, Arial, sans-serif" font-size="44" font-weight="bold" fill="url(#titleGrad)">Meena Vignesh M</text>
  <text x="270" y="150" font-size="30">🧬</text>

  <!-- subtitle -->
  <text x="500" y="205" text-anchor="middle" font-family="Consolas, monospace" font-size="15" letter-spacing="2" fill="#9fb3d9">
    COMPUTATIONAL BIOLOGY &#8226; BIOINFORMATICS &#8226; BIOTECHNOLOGY
  </text>

  <!-- breadcrumb pill -->
  <rect x="150" y="222" width="700" height="30" rx="15" fill="#0d1530" stroke="#2a3a63"/>
  <text x="500" y="242" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#7dd8ff">
    Bioinformatics Explorer  &#9656;  Computational Biology Student  &#9656;  2nd Year Biotechnology
  </text>
</svg>
