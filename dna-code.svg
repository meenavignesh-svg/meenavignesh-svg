<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">DNA code visualization</title>
<desc id="desc">A computational DNA double helix constructed from A, T, G and C nucleotide characters.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b16"/><stop offset="1" stop-color="#0b1730"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<g opacity=".18" fill="#38bdf8" font-family="monospace" font-size="14">
  <text x="35" y="42">ATGCGTACCGATGCTAGCTAGGCTAACGTTACG</text><text x="720" y="80">GCTATCGATCGGATCGTACGATGCTAGCATG</text>
  <text x="50" y="370">GATTACAGGCTTAGCGATCGATGCGTACGTAGC</text><text x="760" y="335">CGATGCTAGCATCGGATACGCTAGGCTAACG</text>
</g>
<g stroke="url(#glow)" stroke-width="4" fill="none" filter="url(#soft)">
  <path d="M330 35 C 650 95, 550 145, 330 210 C 110 275, 10 325, 330 385"/>
  <path d="M870 35 C 550 95, 650 145, 870 210 C 1090 275, 1190 325, 870 385"/>
</g>
<g font-family="monospace" font-weight="700" font-size="22" text-anchor="middle">
  <g fill="#67e8f9">
    <text x="330" y="55">A</text><text x="250" y="90">T</text><text x="205" y="130">G</text><text x="225" y="170">C</text><text x="330" y="214">A</text><text x="435" y="170">T</text><text x="455" y="130">G</text><text x="410" y="90">C</text><text x="330" y="380">G</text>
  </g>
  <g fill="#c4b5fd">
    <text x="870" y="55">T</text><text x="950" y="90">A</text><text x="995" y="130">C</text><text x="975" y="170">G</text><text x="870" y="214">T</text><text x="765" y="170">A</text><text x="745" y="130">C</text><text x="790" y="90">G</text><text x="870" y="380">C</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" opacity=".7">
    <path d="M320 55 L880 55"/><path d="M250 90 L950 90"/><path d="M205 130 L995 130"/><path d="M225 170 L975 170"/><path d="M330 214 L870 214"/>
  </g>
</g>
<g fill="#e2e8f0" font-family="monospace" text-anchor="middle">
 <text x="600" y="35" font-size="16" opacity=".8">A · T · G · C  //  COMPUTATIONAL BIOLOGY</text>
 <text x="600" y="405" font-size="13" opacity=".55">BIOLOGY → DATA → COMPUTATION → INSIGHT</text>
</g>
</svg>
